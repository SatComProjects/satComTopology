start_date: "2024-11-18 00:00:00.000000"
end_date: "2024-11-25 00:00:00.000000"
movement_model: "pyorbital"
distance_model: "sklearn"
ground_objects_properties:
  - identifier: "OneWeb Ground Station"
    data_file: "/path/to/ground_station_data.json"
    type: "ground_station"
    connectivity_properties:
      elevation_above_horizon: 20
      ground_to_space_connections_strategy: "everything-visible"
  # Ground objects can also be written inline, instead of (or on top of) a data_file.
  - identifier: "Inline Points of Presence"
    type: "point_of_presence"
    ground_objects:
      - { id: 0, label: "Paris", latitude: 48.85, longitude: 2.35, altitude: 0.0 }
      - { id: 1, label: "Toulouse", latitude: 43.60, longitude: 1.44, altitude: 0.1 }
    connectivity_properties:
      elevation_above_horizon: 20
      ground_to_space_connections_strategy: "everything-visible"
walker_shells:
  - type: "delta"
    constellation_property:
      identifier: "Andromeda Walker Delta"
      amount_of_orbit_plane: 25
      amount_of_satellite_per_orbit_plane: 40
      inclination: 53.0
      phase_difference_between_satellites: true
      mean_revolution_per_day: 15.0
    orbital_connectivity_property:
      adjacent_inter_satellite_shifting: 1
      maximum_connected_ground_object: 2
      maximum_connected_user_terminal: 5
      maximum_connected_ground_station: 1
    ground_object_white_list: []
