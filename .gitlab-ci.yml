# sat_com_topology/.gitlab-ci.yml
image: python:3.10 # Ensure this matches your project's desired Python version

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  PRIVATE_PYPI_URL: "${CI_API_V4_URL}/projects/2810/packages/pypi/simple"


before_script:
  - python -V
  - pip install --upgrade pip

  - pip config set global.extra-index-url "${PRIVATE_PYPI_URL}"

  - pip config set global.index-url "https://pypi.org/simple"

  - pip install -r requirements.txt # If you use requirements.txt


cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  script:
    # `black` will be installed from pypi.org/simple
    - pip install black
    - black --check .

test:
  stage: test
  script:
    # `pytest` will be installed from pypi.org/simple
    - pip install pytest
    - pytest

pages:
  stage: deploy
  script:
    - cd sphinx
    - make html
    - mv _build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main
    - develop