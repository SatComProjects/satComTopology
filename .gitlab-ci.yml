image: python:3.10

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

before_script:
  - python -V
  - pip install --upgrade pip
  - pip install -r requirements.txt

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  script:
    - pip install black
    - black --check .

test:
  stage: test
  script:
    - pip install pytest
    - pytest

pages:
  stage: deploy
  script:
    - cd sphinx
    - make html
    - mv _build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main
    - develop