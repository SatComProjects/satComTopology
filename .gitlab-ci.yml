image: python:3.12

stages:
  - lint
  - test
  - build
  - publish
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  PYPI_UPLOAD_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"

  TWINE_USERNAME: gitlab-ci-token
  TWINE_PASSWORD: "${CI_JOB_TOKEN}"


cache:
  paths:
    - .cache/pip
  key:
    files:
      - pyproject.toml


default:
  before_script:
    - python -V
    - pip install --upgrade pip

    - pip config set global.index-url "https://pypi.org/simple"

    - |
      if [ -n "${PRIVATE_PYPI_URL_READ}" ]; then
        pip config set global.extra-index-url "${PRIVATE_PYPI_URL_READ}"
      else
        echo "PRIVATE_PYPI_URL_READ is not set. Skipping extra-index-url config."
      fi

    - pip install hatchling twine

    - echo "--- Diagnosing Python environment (advanced) ---"
    - which python
    - python -c "import sys; print(sys.executable)"
    - pip list
    - python -c "import sys; print(sys.path)"

    # CORRECTED COMMANDS BELOW:
    # Diagnostic 1: Check if 'hatch' module spec can be found
    - |
      python -c "import importlib.util; spec = importlib.util.find_spec('hatch'); print(f'Found hatch spec: {spec}')"

    # Diagnostic 2: Attempt to import 'hatch' and catch any import errors
    - | # Use the pipe '|' to indicate a multi-line string for the shell command
      python -c "
      try:
          import hatch
          print('Hatch module imported successfully!')
      except Exception as e:
          print(f'Failed to import hatch module: {e}')
      "
    - echo "--- End Diagnosis (advanced) ---"


lint:
  stage: lint
  script:
    - pip install black==25.1.0 --extra-index-url "${PRIVATE_PYPI_URL}"
    - black --check .

test:
  stage: test
  script:
    - pip install -r requirements.txt # --extra-index-url "${PRIVATE_PYPI_URL}"
    - pip install pytest # --extra-index-url "${PRIVATE_PYPI_URL}"
    - pytest


build_package:
  stage: build
  script:
    - python -m hatch build
    - python -m twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH =~ /^release\/v/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

publish_package:
  stage: publish
  script:
    - TWINE_USERNAME=${TWINE_USERNAME} TWINE_PASSWORD=${TWINE_PASSWORD} python -m twine upload --repository-url ${PYPI_UPLOAD_URL} dist/*
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
  needs:
    - build_package
  variables:
    GIT_STRATEGY: none


pages:
  stage: deploy
  script:
    - pip install -r sphinx/requirements.txt
    - cd sphinx
    - make html
    - mv _build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main
    - develop