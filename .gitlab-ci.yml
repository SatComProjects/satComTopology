image: python:3.10

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  PRIVATE_PYPI_URL: "${CI_API_V4_URL}/projects/<TELECOM_LIB_PROJECT_ID>/packages/pypi/simple"

default:
  before_script:
    - python -V
    - pip install --upgrade pip
    -
    - pip config set global.extra-index-url "${PRIVATE_PYPI_URL}"
    - pip config set global.index-url "https://pypi.org/simple"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  script:
    - pip install black==25.1.0
    - black --check .

test:
  stage: test
  script:
    - pip install -r requirements.txt
    - pip install pytest # pytest will be found via the configured indexes
    - pytest

pages:
  stage: deploy
  script:
    - cd sphinx
    - make html
    - mv _build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main
    - develop
