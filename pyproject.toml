[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sat_com_topology"
version = "1.1"
authors = [
  { name="Louis BARBIER", email="louis.barbier@isae-supaero.fr" },
]
description = "Satellite communication model package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    'networkx>=3.2.1',
    'pyorbital>=1.8.2',
    'geopy>=2.4.1'
]

[project.urls]
Homepage = "https://github.com/elbarbi/satComTopology"
Issues = "https://github.com/elbarbi/satComTopology/issues"

[tool.pytest.ini_options]
pythonpath = [
  ".", "src"
]
[tool.hatch.build.targets.wheel]

packages = ["src/sat_com_model", "src/sat_com_builder", "src/sat_com_adapter", "src/sat_com_trajectopy", "src/sat_com_application"]